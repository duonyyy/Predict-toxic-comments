services:
  # ===================================================
  # 1. KAFKA BROKER (1 Broker duy nhất - Tiết kiệm RAM)
  # ===================================================
  kafka-1:
    image: apache/kafka:3.7.0
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093"
      KAFKA_LISTENERS: "INTERNAL://:29092,CONTROLLER://kafka-1:9093,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:29092,EXTERNAL://${KAFKA_ADVERTISED_LISTENERS:-localhost}:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks:
      - comment-toxic
    deploy:
      resources:
        limits:
          memory: 512M

  # ===================================================
  # 2. REDIS CACHE
  # ===================================================
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - comment-toxic
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 256M

  # ===================================================
  # 3. PYTHON CONSUMER (DS108 Hierarchical Classifier)
  # ===================================================
  toxic-consumer:
    build: ./python_consumer
    container_name: toxic-consumer
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092
      - MONGO_URI=${URL_MONGO:-${MONGO_URI:-mongodb://localhost:27017}}
      - DATABASE_NAME=${DATABASE_NAME:-commentStreaming}
      - TASK1_MODEL_PATH=/model/phobert_task1.pt
      - TASK2_MODEL_PATH=/model/xlmr_task2.pt
    volumes:
      - ./model:/model
    networks:
      - comment-toxic
    depends_on:
      - kafka-1
      - redis
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  comment-toxic:
    name: comment-toxic
    driver: bridge

volumes:
  kafka-1-data:
  redis-data:

